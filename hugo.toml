baseURL = 'https://simonvdknaap.github.io/NIKH_website/'
languageCode = 'en-us'
title = 'NIKH'
# Titels van tags, technieken en materialen: alleen de eerste letter als hoofdletter
titleCaseStyle = 'firstupper'
theme = 'kaiser'

# De map images/ in de hoofdmap wordt als assets/images ingeladen,
# zodat content/_content.gotmpl de foto's over de albums kan verdelen.
[[module.mounts]]
  source = 'assets'
  target = 'assets'
[[module.mounts]]
  source = 'images'
  target = 'assets/images'

[params]
  # Het invulformulier op de werkpagina's stuurt de gegevens naar dit adres
  # (via formsubmit.co, zie assets/js/custom.js)
  formulier_email = '4.tannest.coconut@icloud.com'

[[menus.main]]
  name = 'Tags'
  pageRef = '/tags'
  weight = 80

# Filters op de albumpagina's; elke waarde krijgt een eigen overzichtspagina
[taxonomies]
  category = 'categories'
  tag = 'tags'
  techniek = 'technieken'
  materiaal = 'materialen'

[[menus.main]]
  name = 'Technieken'
  pageRef = '/technieken'
  weight = 81

[[menus.main]]
  name = 'Materialen'
  pageRef = '/materialen'
  weight = 82
