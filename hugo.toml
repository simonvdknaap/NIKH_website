baseURL = 'https://simonvdknaap.github.io/NIKH_website/'
languageCode = 'en-us'
title = 'NIKH'
# Titels van tags, technieken en materialen: alleen de eerste letter als hoofdletter
titleCaseStyle = 'firstupper'
# Het verkleinen van veel grote foto's kan bij de eerste build lang duren
timeout = '300s'
theme = 'kaiser'

# De map images/ in de hoofdmap wordt als assets/images ingeladen,
# zodat content/_content.gotmpl de foto's over de albums kan verdelen.
[[module.mounts]]
  source = 'assets'
  target = 'assets'
[[module.mounts]]
  source = 'images'
  target = 'assets/images'

[params]
  # Repository waar het invulformulier op de werkpagina's de .yaml-bestanden
  # opslaat (via GitHub, zie assets/js/custom.js)
  github_repo = 'simonvdknaap/NIKH_website'
  github_branch = 'main'
  # Het invulformulier stuurt de gegevens (met het .yaml-bestand als bijlage)
  # naar dit adres, via formsubmit.co
  formulier_email = '4.tannest.coconut@icloud.com'


# Filters op de albumpagina's; elke waarde krijgt een eigen overzichtspagina
[taxonomies]
  category = 'categories'
  tag = 'tags'
  techniek = 'technieken'
  materiaal = 'materialen'

[[menus.main]]
  name = 'Werk'
  pageRef = '/werk'
  weight = 10
